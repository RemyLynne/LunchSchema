name: Bug report
description: File a bug report
labels:
  - Kind/Bug

body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Please fill out the details bellow
  - id: steps
    type: textarea
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
    validations:
      required: true
  - id: expected
    type: textarea
    attributes:
      label: Expected behaviour
      description: What did you expect to happen
    validations:
      required: true
  - id: actual
    type: textarea
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true
  - id: proof
    type: textarea
    attributes:
      label: Proof of bug
      description: Screenshots, error message, logs
      render: shell
  - id: version
    type: input
    attributes:
      label: Version
      description: The version you found the bug in
      placeholder: v1.2.3
  - id: checks
    type: checkboxes
    attributes:
      label: Pre-submit checklist
      options:
        - label: I can reproduce this issue somewhat consistently
