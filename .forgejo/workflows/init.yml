name: Init

on:
  create:
  push:
  workflow_dispatch:

jobs:
  init-from-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Replace template variables
        env:
          USER: ${{ forgejo.event.repository.owner.full_name }}
          REPO_NAME: ${{ forgejo.event.repository.name }}
          REPO_DESCRIPTION: ${{ forgejo.event.repository.description }}
          SERVER: ${{ forgejo.server_url }}
          REPO: ${{ forgejo.repository }}
        run: |
          set -e

          if ! grep -lE '\{\{[a-zA-Z_]+\}\}' LICENSE README.md >/dev/null 2>&1; then
            echo "No template files found, nothing to do."
            exit 0 # Exit gracefully, this might not be an error
          fi

          export YEAD="$(date +%Y)"

          python3 - <<'PYEOF'
          import os

          replacements = {
            "{{year}}": os.environ.get("YEAR", ""),
            "{{user}}": os.environ.get("USER", ""),
            "{{name}}": os.environ.get("REPO_NAME", ""),
            "{{description}}": os.environ.get("REPO_DESCRIPTION", ""),
            "{{server}}": os.environ.get("SERVER", ""),
            "{{repo}}": os.environ.get("REPO"),
          }

          for path in ("LICENSE", "README.md"):
            with open(path, "r", encoding="utf-8") as f:
              content = f.read()
            for placeholder, value in replacements.items():
              content = content.replace(placeholder, value)
            with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          PYEOF
      - name: Remote the init workflow
        run: |
          rm .forgejo/workflows/init.yml
      - name: configure git
        run: |
          git config user.name "forgejo-actions"
          git config user.email "actions@noreply.localhost"
      - name: Commit&push changes
        run: |
          git add LICENSE README.md .forgejo/workflows/init.yml
          git commit -m "chore: Template init"
          git push
