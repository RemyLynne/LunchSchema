logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %clr(%level) [%thread] %clr(%logger){cyan} - %clr(%msg){%p}%n"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
spring:
  application:
    name: Lunch Scheme
  config:
    import: optional:file:.env[.properties]
  datasource:
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 2500
      idle-timeout: 300_000
      keepalive-time: 60_000
      leak-detection-threshold: 60000
      max-lifetime: 1800_000
      maximum-pool-size: 32
      minimum-idle: 8
      validation-timeout: 1000
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWD}
  devtools:
    add-properties: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migrations
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

---

logging:
  level:
    no.itx.lunchscheme: trace
spring:
  config:
    activate:
      on-profile: debug
  flyway:
    enabled: false
